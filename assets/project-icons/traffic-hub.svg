  <circle cx="256" cy="200" r="80" stroke="#00ff66" stroke-width="8" stroke-dasharray="20 15" />
  <circle cx="256" cy="200" r="15" fill="#00ff66" />
  
  <!-- Horizontal AI Sweep/Scan Laser -->
  <line x1="40" y1="200" x2="472" y2="200" stroke="#00ff66" stroke-width="10" stroke-linecap="round" opacity="0.8" />
